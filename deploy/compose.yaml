services:
  ledger:
    image: ghcr.io/erjonfida/ledger:${TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?}:5432/ledger?sslmode=require
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on: [redis]

  redis:
    image: redis:8
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:?} --to ledger:8094
    ports: ["80:80", "443:443"]
    volumes: [caddy-data:/data]

volumes:
  caddy-data:
