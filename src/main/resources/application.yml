server:
  port: 8094
  forward-headers-strategy: native

spring:
  application:
    name: ledger
  datasource:
    url: jdbc:postgresql://localhost:5443/ledger
    username: ledger
    password: ledger
  data:
    redis:
      port: 6380
      connect-timeout: 500ms
      timeout: 500ms
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  batch:
    job:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: reconcile
  main:
    web-application-type: none
  batch:
    job:
      enabled: true
